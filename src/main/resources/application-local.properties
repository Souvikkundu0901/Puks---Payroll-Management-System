# Local profile
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/payroll}
spring.datasource.username=${DATABASE_USER:payroll}
spring.datasource.password=${DATABASE_PASSWORD:payroll}

spring.flyway.url=${FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${DATABASE_USER:payroll}
spring.flyway.password=${DATABASE_PASSWORD:payroll}

spring.jpa.show-sql=false

# Local Mailpit configuration
mail.enabled=true
spring.mail.host=localhost
spring.mail.port=1025
