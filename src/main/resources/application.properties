spring.application.name=payroll
server.port=${PORT:8080}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# Actuator: expose only health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.mail.enabled=false

# HikariCP sizing for 512MB hosts
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=300000

# Mail configuration
mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:noreply@octopyder.com}

# Demo Data Seeder (off by default, never runs in prod/test)
app.seed-demo-data=${APP_SEED_DEMO_DATA:false}
app.base-url=${APP_BASE_URL:http://localhost:8080}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Secrets: no defaults. The app refuses to start if these are missing.
jwt.secret=${JWT_SECRET:}
app.encryption-key=${APP_ENCRYPTION_KEY:}
